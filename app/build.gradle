apply plugin: 'com.android.application'
android {
    compileSdk 34
    defaultConfig {
        applicationId "com.birdbraintechnologies.birdblox"
        minSdkVersion 21
        targetSdkVersion 34
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField "boolean", "IS_FINCHBLOX", "false"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions = ["mode"]
    productFlavors {
        birdblox {
            buildConfigField "boolean", "IS_FINCHBLOX", "false"
            buildConfigField "boolean", "IS_HATCHLING", "false"
            dimension "mode"
            manifestPlaceholders["appLabel"] = "BirdBlox"
            manifestPlaceholders["orientation"] = "unspecified"
            versionCode 19
            versionName "1.4.2"
        }
        finchblox {
            buildConfigField "boolean", "IS_FINCHBLOX", "true"
            buildConfigField "boolean", "IS_HATCHLING", "false"
            dimension "mode"
            applicationIdSuffix ".finchblox"
            manifestPlaceholders["appLabel"] = "FinchBlox"
            manifestPlaceholders["orientation"] = "landscape"
            versionCode 9
            versionName "1.2.3"
        }
        hatchicons {
            buildConfigField "boolean", "IS_FINCHBLOX", "true"
            buildConfigField "boolean", "IS_HATCHLING", "true"
            dimension "mode"
            applicationIdSuffix ".hatchling"
            manifestPlaceholders["appLabel"] = "Hatchicons"
            manifestPlaceholders["orientation"] = "landscape"
            versionCode 1
            versionName "1.0"
        }
        hatchblox {
            buildConfigField "boolean", "IS_FINCHBLOX", "false"
            buildConfigField "boolean", "IS_HATCHLING", "true"
            dimension "mode"
            applicationIdSuffix ".hatchplus"
            manifestPlaceholders["appLabel"] = "HatchBlox"
            manifestPlaceholders["orientation"] = "landscape"
            versionCode 1
            versionName "1.0"
        }
    }
    namespace 'com.birdbraintechnologies.birdblox'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.googlecode.mp4parser:isoparser:1.0.2'
    implementation 'com.dropbox.core:dropbox-core-sdk:2.1.1'
    implementation 'com.squareup.okhttp3:okhttp:3.10.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'
    implementation 'commons-io:commons-io:2.7'
    testImplementation 'junit:junit:4.12'
    compileOnly 'com.google.android.things:androidthings:1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
